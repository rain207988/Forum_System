services:
  forum-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: forum-system:latest
    container_name: forum-app
    depends_on:
      forum-mysql:
        condition: service_healthy
      forum-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FORUM_DB_URL: jdbc:mysql://forum-mysql:3306/forum_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      FORUM_DB_USERNAME: ${FORUM_DB_USERNAME}
      FORUM_DB_PASSWORD: ${FORUM_DB_PASSWORD}
      FORUM_REDIS_HOST: forum-redis
      FORUM_REDIS_PORT: 6379
      FORUM_REDIS_PASSWORD: ${FORUM_REDIS_PASSWORD}
      FORUM_JWT_SECRET: ${FORUM_JWT_SECRET}
      FORUM_CORS_ALLOWED_ORIGIN_PATTERNS: ${FORUM_CORS_ALLOWED_ORIGIN_PATTERNS}
    ports:
      - "58080:58080"
    restart: unless-stopped

  forum-mysql:
    image: mysql:8.4
    container_name: forum-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: forum_db
      MYSQL_USER: ${FORUM_DB_USERNAME}
      MYSQL_PASSWORD: ${FORUM_DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - forum-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  forum-redis:
    image: redis:7.4-alpine
    container_name: forum-redis
    command: >
      sh -c "redis-server --appendonly yes --requirepass \"$${FORUM_REDIS_PASSWORD}\""
    environment:
      FORUM_REDIS_PASSWORD: ${FORUM_REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - forum-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${FORUM_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  forum-mysql-data:
  forum-redis-data:
